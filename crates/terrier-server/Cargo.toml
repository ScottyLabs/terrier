[package]
name = "terrier-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "terrier"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = [
  "rt-tokio",
  "default-https-client",
  "behavior-version-latest",
] }
axum.workspace = true
base64 = "0.22"
dotenvy.workspace = true
fred = { version = "10", features = ["i-scripts", "unix-sockets"] }
leash = { git = "https://git.cmu.dev/ScottyLabs/leash", branch = "main", version = "0.1.0" }
migration = { version = "0.1.0", path = "migration" }
openidconnect = { version = "4.1.0", default-features = false, features = [
  "reqwest",
  "rustls-tls",
  "timing-resistant-secret-traits",
] }
sea-orm = { version = "2.0.4", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-uuid",
  "with-json",
  "with-chrono",
  "with-rust_decimal",
  "postgres-array",
] }
serde.workspace = true
serde_json = "1.0.151"
terrier-common.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tower-sessions = "0.14"
tower-sessions-redis-store = "0.16"
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
