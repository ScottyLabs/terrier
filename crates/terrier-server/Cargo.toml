[package]
name = "terrier-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "terrier"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-oidc = { git = "https://codeberg.org/pfzetto/axum-oidc", rev = "007135e2c26830f6c89d1659302c228076c7afa7", version = "1.0.0-dev-2" }
base64 = "0.22"
dotenvy.workspace = true
fred = { version = "10", features = ["unix-sockets"] }
leash = { git = "https://git.cmu.dev/ScottyLabs/leash", branch = "main", version = "0.1.0" }
migration = { version = "0.1.0", path = "migration" }
sea-orm = { version = "2.0.4", default-features = false, features = [
  "macros",
  "runtime-tokio-native-tls",
  "sqlx-postgres",
  "with-uuid",
  "with-json",
  "with-chrono",
  "with-rust_decimal",
  "postgres-array",
] }
serde.workspace = true
serde_json = "1.0.151"
terrier-common.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tower-sessions = "0.14"
tower-sessions-redis-store = "0.16"
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
