[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
sea-orm-migration = { version = "2.0.4", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
