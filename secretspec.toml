[project]
name = "terrier"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[profiles.default]
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret" }
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
INSTANCE_ADMIN_SUBJECTS = { description = "JSON array of Keycloak subjects with instance admin access" }

[profiles.prod]
SENTRY_DSN = { description = "Governance-managed Sentry project DSN" }

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["openbao"]

[profiles.dev]
INSTANCE_ADMIN_SUBJECTS = { required = false }
