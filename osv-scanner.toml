[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2026-11-27
reason = "False positive for block-buffer 0.10.4: upstream limits affected versions to >=0.11.0,<0.12.1. Version 0.10.4 stores the cursor separately from the buffer. Recheck the OSV range before extending this exception: https://github.com/RustCrypto/utils/security/advisories/GHSA-qwgh-2vcv-g2f7"

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2026-12-05
reason = "The advisory affects private-key RSA decryption. OpenID Connect uses RSA only to verify provider signatures with public keys; Terrier performs no RSA decryption. SQLx's MySQL driver remains disabled. Recheck before adding private-key RSA operations or enabling MySQL. https://rustsec.org/advisories/RUSTSEC-2023-0071.html"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2026-12-07
reason = "SQLx's SQLite driver is locked but never compiled. sqlx-sqlite 0.9.0 caps libsqlite3-sys below the fixed 0.39.0."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2026-12-15
reason = "RustSec marks Chrono unmaintained and lists no patched release. Terrier uses SeaORM's Chrono timestamp types. Track migration to a maintained timestamp library: https://rustsec.org/advisories/RUSTSEC-2026-0543.html"
